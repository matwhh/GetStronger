# FORGE — перевірки на кожен пуш.
#
# Відколи публікація автоматична (tools/auto-publish.sh на Mac комітить
# і пушить сам), CI — єдине місце, де зміни бачить хтось, крім автора.
# Тому тут не тільки юніти: браузерні перевірки теж ганяються самі.
#
# Три рівні, від дешевого до дорогого:
#   test           — юніти + гігієна. Секунди. На кожен пуш і PR.
#   browser        — ядро браузерних перевірок. ~5 хв. На кожен пуш і PR.
#   browser-full   — усе інше. ~40 хв. Раз на добу і на вимогу.
#
# ЧОМУ ХОСТИ ГЛУШАТЬСЯ. Перевірки ходять по file:// і працюють із
# посадженим у сховище профілем — хмара їм не потрібна. Але сторінка
# усе одно смикне Supabase, а на раннері GitHub інтернет справжній:
# тести або залежать від стану бойової бази, або (гірше) щось у ній
# створюють. Тому домен проєкту й Sentry вішаються на 127.0.0.1 —
# CI фізично не може дотягтись до продакшену.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright прибитий цвяхами: package-lock.json свідомо в .gitignore,
  # тож відтворюваність дає саме ця версія, а не lock-файл.
  PW_VERSION: '1.56.0'

jobs:
  test:
    name: Тести і гігієна
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Юніт-тести
        run: npm test
      - name: Гігієна репозиторію
        run: node tools/ci-hygiene.mjs

      # Бекап, з якого не відновлювались, — не бекап (OPS-001). Тут ганяється
      # повний цикл на синтетичній фікстурі: файл → tools/restore-backup.mjs →
      # тимчасовий локальний Postgres → db/backup-export.sql → порівняння.
      # Мережі й бойової бази не потребує; postgresql на ubuntu-latest уже є.
      # Код 3 («перевірено не все» — немає Postgres) тут теж провал: мовчазний
      # пропуск цієї перевірки й був причиною знахідки.
      - name: Відновлення з резервної копії
        run: node tools/verify-backup-roundtrip.mjs

  browser:
    name: Браузер — ядро
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Відрізати хмару
        run: bash tools/ci-offline.sh

      - name: Playwright
        run: |
          npm i --no-save --no-audit --no-fund "playwright@${PW_VERSION}"
          npx playwright install --with-deps chromium

      - name: Перевірки
        run: bash tools/ci-browser.sh core

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-core-log
          path: .ci-browser/
          retention-days: 7

  browser-full:
    name: Браузер — усе
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Відрізати хмару
        run: bash tools/ci-offline.sh

      - name: Playwright
        run: |
          npm i --no-save --no-audit --no-fund "playwright@${PW_VERSION}"
          npx playwright install --with-deps chromium

      - name: Перевірки
        run: bash tools/ci-browser.sh full

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-full-log
          path: .ci-browser/
          retention-days: 7
