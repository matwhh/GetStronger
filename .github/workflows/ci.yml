# Get Stronger — перевірки на кожен пуш.
#
# Публікація ручна: кнопка «Опублікувати.command» на Mac проганяє юніти й
# гігієну і пушить. CI — друга пара очей після неї, і єдине місце, де
# ганяються браузерні перевірки: локально їх ніхто щоразу не запускає.
#
# Три рівні, від дешевого до дорогого:
#   test           — юніти + гігієна. Секунди. На кожен пуш і PR.
#   browser        — ядро браузерних перевірок. ~6 хв. На кожен пуш і PR.
#   browser-full   — усе інше. ~40 хв. Раз на добу і на вимогу.
#
# ЧОМУ ХОСТИ ГЛУШАТЬСЯ. Перевірки ходять по file:// і працюють із
# посадженим у сховище профілем — хмара їм не потрібна. Але сторінка
# усе одно смикне Supabase, а на раннері GitHub інтернет справжній:
# тести або залежать від стану бойової бази, або (гірше) щось у ній
# створюють. Тому домен проєкту й Sentry вішаються на 127.0.0.1 —
# CI фізично не може дотягтись до продакшену.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # actions/*@v5, а не v4: четверті версії збиралися під Node 20, раннер уже
  # тягне їх на Node 24 і пише про це попередження в кожному прогоні. Коли
  # сумісність приберуть, вони перестануть запускатись — а попередження, яке
  # бачиш щодня, перестаєш читати задовго до того.
  #
  # Playwright прибитий цвяхами: package-lock.json свідомо в .gitignore,
  # тож відтворюваність дає саме ця версія, а не lock-файл.
  PW_VERSION: '1.56.0'

jobs:
  test:
    name: Тести і гігієна
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Юніт-тести
        run: npm test
      - name: Гігієна репозиторію
        run: node tools/ci-hygiene.mjs

      # Бекап, з якого не відновлювались, — не бекап (OPS-001). Тут ганяється
      # повний цикл на синтетичній фікстурі: файл → tools/restore-backup.mjs →
      # тимчасовий локальний Postgres → db/backup-export.sql → порівняння.
      # Мережі й бойової бази не потребує; postgresql на ubuntu-latest уже є.
      # Код 3 («перевірено не все» — немає Postgres) тут теж провал: мовчазний
      # пропуск цієї перевірки й був причиною знахідки.
      - name: Відновлення з резервної копії
        run: node tools/verify-backup-roundtrip.mjs

      # Оцінка тижня (ELO-001/002/004/005): міграція накочується на знімок
      # бойової схеми в тимчасовому локальному Postgres і перевіряється
      # сценаріями, включно з гонкою двох паралельних викликів.
      - name: Оцінка тижня на копії схеми
        run: node tools/verify-elo-week.mjs

      # Права й політики. Міграція, що забрала в authenticated UPDATE на
      # profiles, зламала збереження профілю ЦІЛКОМ, і жодна наявна перевірка
      # цього не бачила: юніти працюють із підробленою мережею, браузерні —
      # з file://, а RLS-матриця дивиться на політики, не на GRANT. Тут по
      # знімку бойової схеми виконуються рівно ті оператори, які шле клієнт.
      - name: Права й політики на копії схеми
        run: node tools/verify-schema-perms.mjs

      # SQL-тести сервера (TST-017): 92 перевірки авторитетного шару — атаки
      # підробленим payload, бюджети, реконсиляція, RLS, адмінські RPC. Досі
      # ганялись лише руками в SQL Editor, без сліду останнього прогону.
      # Кожен скрипт завершується raise exception, тож усе, що він насіяв,
      # відкочується; сюди він віддає рядок «N з M пройдено».
      - name: SQL-тести сервера на копії схеми
        run: node tools/verify-sql-suites.mjs

      # Вимкнена категорія рейтингу: ваги перерозподіляються, стеля
      # лишається та сама, бонуси перестають вимагати те, чого людина не
      # веде. Ганяється на копії бойової схеми, як і решта SQL-перевірок.
      - name: Вимкнена категорія рейтингу на копії схеми
        run: node tools/verify-elo-skip.mjs

      # Баланс ELO (TST-011). Симуляція детермінована й ганяє продакшен-ядро
      # з db/elo-config.json. Відомі відхилення перелічені в самому скрипті
      # з причиною й датою; нове відхилення валить збірку.
      - name: Баланс ELO
        run: node tools/simelo.mjs

  # ------------------------------------------------------------------
  # OPS-007. Free-план Supabase паузить проєкт після 7 днів без
  # API-запитів (pg_cron не рахується) — в цій організації один проєкт
  # уже так зупинився. Тиждень без відкриття сайту = пауза: хмарний режим
  # починає отримувати мережеві помилки, forge-elo-week не виконується.
  #
  # Один GET раз на три доби цього не допускає. Ключ і домен беруться з
  # js/config.js — вони публічні за задумом (anon-ключ боронить RLS), тож
  # секретів тут не заводиться.
  pulse:
    name: Пульс Supabase
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Один запит, щоб проєкт не заснув
        run: |
          URL=$(grep -o "url: *'[^']*'" js/config.js | head -1 | sed "s/.*'\(.*\)'/\1/")
          KEY=$(grep -o "anonKey: *'[^']*'" js/config.js | head -1 | sed "s/.*'\(.*\)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "js/config.js без ключів Supabase — локальний режим, пульс не потрібен"
            exit 0
          fi
          # /auth/v1/health, а не /rest/v1/: корінь PostgREST віддає 401 на
          # самий лише anon-ключ (перевірено curl-ом), і пульс падав би
          # щоразу. health відповідає 200 і так само рахується запитом до
          # API проєкту — а саме їх і рахує лічильник неактивності.
          curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' -H "apikey: $KEY" "$URL/auth/v1/health"

  browser:
    name: Браузер — ядро
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Відрізати хмару
        run: bash tools/ci-offline.sh

      - name: Playwright
        run: |
          npm i --no-save --no-audit --no-fund "playwright@${PW_VERSION}"
          npx playwright install --with-deps chromium

      - name: Перевірки
        run: bash tools/ci-browser.sh core

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-core-log
          path: .ci-browser/
          retention-days: 7

  browser-full:
    name: Браузер — усе
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Відрізати хмару
        run: bash tools/ci-offline.sh

      - name: Playwright
        run: |
          npm i --no-save --no-audit --no-fund "playwright@${PW_VERSION}"
          npx playwright install --with-deps chromium

      - name: Перевірки
        run: bash tools/ci-browser.sh full

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-full-log
          path: .ci-browser/
          retention-days: 7
