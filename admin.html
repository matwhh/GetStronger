<!-- Сторож: без сесії — welcome; не-approved сюди теж не потрапить
     (окрім адміна). Права на дані все одно перевіряє сервер (is_admin

<script src="js/agegate.js"></script>
<script src="js/nosw.js"></script>
<script src="js/theme-boot.js"></script>
<!-- build-meta:start -->
<link rel="canonical" href="https://get-stronger.vercel.app/admin.html">

<body>

<a class="skip-link" href="#main">До вмісту</a>

<div class="bg-fx"></div>

<header id="site-nav"></header>

<main id="main" tabindex="-1">
  <section class="section">
    <div class="wrap">

      <h1 class="reveal">Адміністрування</h1>
      <p class="lead reveal" data-d="1">
        Рішення зберігаються на сервері й контролюються правами бази —
        не цією сторінкою.
      </p>

      <!-- Перемикач вкладок. Розмітка тут, а не в JS: сторінка має
           показати рамку одразу, ще до відповіді сервера. -->
      <div class="seg mt-3 reveal" role="radiogroup" aria-label="Розділ адмінки" id="adm-tabs">
        <label class="seg__item">
          <input type="radio" name="adm-tab" value="requests" checked>
          <span>Заявки</span>
        </label>
        <label class="seg__item">
          <input type="radio" name="adm-tab" value="elo">
          <span>ELO</span>
        </label>
      </div>

      <div id="adm" class="mt-3"></div>
      <div id="adm-elo" class="mt-3" hidden></div>

    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script defer src="js/config.js"></script>
<script defer src="js/date-core.js"></script>
<script defer src="js/errors.js"></script>

     сторінки. Вміст іде ПЕРЕД механізмом — інакше help.js на швидкому
     кеші не знайшов би розділу й сховав би кнопку назавжди. -->
<script defer src="js/help.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/elo-core.js"></script>
<script defer src="js/elo-api.js"></script>
<script defer src="js/admin.js"></script>
<script defer src="js/admin-elo.js"></script>
