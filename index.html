<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Stronger — сьогодні</title>
<meta name="description" content="Твій день у Get Stronger: що тренувати, скільки лишилось калорій, як змінився Get Stronger Rating. Один екран для щоденного використання.">
<meta name="author" content="Matthew Grace">
<meta name="copyright" content="© 2026 Matthew Grace. Усі права застережено.">
<!-- Картка для месенджерів і соцмереж. og:url і canonical додає
     js/app.js, коли в config.js заповнено siteUrl: без домену
     абсолютне посилання все одно було б неправильним. -->
<!-- og:image статично, а не з JS: краулери превʼю в месенджерах
     (Telegram, Slack, WhatsApp) JavaScript не виконують.
     Адреса АБСОЛЮТНА: відносний og:image Telegram ще розбирає, а
     Facebook, LinkedIn, X і Slack — ні, і в них картки лишались без
     картинки. Домен той самий, що siteUrl у js/config.js.
     og:title тут — коротка назва розділу, а не SEO-заголовок: у картці
     месенджера потрібне «де я опинюсь», а не ключові слова. Довгі
     варіанти лишаються в <title> і meta description — їх читає пошук.
     og:site_name лишається: без нього Telegram друкує в синьому рядку
     голий домен. Тому site_name = Get Stronger, а title = назва розділу —
     разом вони не дублюють одне одного. -->
<meta property="og:image" content="https://get-stronger.vercel.app/og-image.png?v=3">
<meta property="og:image:secure_url" content="https://get-stronger.vercel.app/og-image.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Get Stronger — знак ковадла й назва на чорному тлі">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Get Stronger">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="Сьогодні">
<meta property="og:description" content="Тренування · Харчування · Прогрес">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- iOS не читає manifest для «На екран Home»: без цього рядка ярлик
     отримував би зменшений скріншот сторінки замість знака Get Stronger. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Get Stronger">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифти не блокують перший показ: стиль вантажиться як print (браузер
     не чекає на нього), а після завантаження перемикається на all.
     Без JS спрацьовує noscript-запасний варіант. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" media="print" data-async href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>
<!-- Віковий сторож. Без defer і найпершим: рішення «пускати чи ні»
     має бути ухвалене до того, як зʼявиться бодай рядок розмітки.
     Логіка — js/agegate.js, джерело правди — profile.birthDate. -->
<script src="js/agegate.js"></script>
<link rel="stylesheet" href="css/style.css">
<script src="js/nosw.js"></script>
<script src="js/theme-boot.js"></script>

<!-- build-meta:start -->
<link rel="canonical" href="https://get-stronger.vercel.app/index.html">
<meta property="og:url" content="https://get-stronger.vercel.app/index.html">
<!-- build-meta:end -->
</head>
<body>

<!-- Перший елемент у порядку табуляції: дозволяє з клавіатури
     перескочити меню й потрапити одразу в контент. -->
<a class="skip-link" href="#main">До вмісту</a>

<div class="bg-fx"></div>

<header id="site-nav"></header>

<main id="main" tabindex="-1">

  <!-- ========== СЬОГОДНІ ==========
       Головна Get Stronger — це і є екран дня. Раніше їх було два: index.html
       переказував стан і вів кнопкою на today.html, де стан можна було
       ЗМІНИТИ. Два екрани на одне питання «що в мене зараз» означали
       зайвий перехід у кожній щоденній дії й два місця, які могли
       розійтись у показаннях. Тепер сторінка одна, а today.html лишився
       перенаправленням для старих посилань і закладок.

       Увесь вміст малює js/today.js. Розмітка тут — каркас, щоб без JS
       сторінка чесно сказала, чому вона порожня. -->
  <section class="section section--dash">
    <div class="wrap wrap--narrow">

      <!-- Заголовок малює js/today.js: це назва обраної програми, а вона
           відома лише після читання профілю. Статичного h1 тут немає
           навмисно — інакше на екрані на мить стояв би чужий заголовок,
           який потім підміняється. -->
      <div id="today">
        <noscript><p class="small">Ця сторінка збирає ваш день із профілю — без JavaScript їй нема з чого збиратись.</p></noscript>
      </div>

    </div>
  </section>

</main>

<footer id="site-footer"></footer>

<script defer src="js/config.js"></script>
<script defer src="js/date-core.js"></script>
<script defer src="js/errors.js"></script>
<script defer src="js/age-core.js"></script>
<script defer src="js/onboarding-core.js"></script>
<script defer src="js/app.js"></script>
<!-- Контекстна довідка: один механізм на весь сайт, вміст залежить від
     сторінки. Вміст іде ПЕРЕД механізмом — інакше help.js на швидкому
     кеші не знайшов би розділу й сховав би кнопку назавжди. -->
<script defer src="js/help.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/elo-core.js"></script>
<script defer src="js/elo-api.js"></script>
<script defer src="js/elo-hooks.js"></script>
<script defer src="js/history-core.js"></script>
<script defer src="js/exercises.js"></script>
<script defer src="js/reps-core.js"></script>
<script defer src="js/programs-data.js"></script>
<script defer src="js/nutrition-core.js"></script>
<script defer src="js/tracker-core.js"></script>
<script defer src="js/tracker-tile-core.js"></script>
<script defer src="js/workout-core.js"></script>
<script defer src="js/progression-core.js"></script>
<script defer src="js/measure-core.js"></script>
<script defer src="js/today.js"></script>
</body>
</html>
