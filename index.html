<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE — сьогодні</title>
<meta name="description" content="Твій день у Forge: що тренувати, скільки лишилось калорій, як змінився Forge Rating. Один екран для щоденного використання.">
<!-- Картка для месенджерів і соцмереж. og:url і canonical додає
     js/app.js, коли в config.js заповнено siteUrl: без домену
     абсолютне посилання все одно було б неправильним. -->
<!-- og:image статично, а не з JS: краулери превʼю в месенджерах
     (Telegram, Slack, WhatsApp) JavaScript не виконують.
     Адреса АБСОЛЮТНА: відносний og:image Telegram ще розбирає, а
     Facebook, LinkedIn, X і Slack — ні, і в них картки лишались без
     картинки. Домен той самий, що siteUrl у js/config.js.
     og:title і og:description тут навмисно короткі й однакові на всіх
     сторінках: у картці месенджера потрібне імʼя, а не SEO-заголовок.
     Довгі варіанти лишаються в <title> і meta description для пошуку.
     og:site_name прибрано — з ним «FORGE» стояло в картці двічі. -->
<meta property="og:image" content="https://forge-mold1.vercel.app/og-image.png">
<meta property="og:image:secure_url" content="https://forge-mold1.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FORGE — тренування, харчування, разовий максимум">
<meta property="og:type" content="website">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="FORGE">
<meta property="og:description" content="Тренування · Харчування · Прогрес">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- iOS не читає manifest для «На екран Home»: без цього рядка ярлик
     отримував би зменшений скріншот сторінки замість знака Forge. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифти не блокують перший показ: стиль вантажиться як print (браузер
     не чекає на нього), а після завантаження перемикається на all.
     Без JS спрацьовує noscript-запасний варіант. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>
<!-- Віковий сторож. Без defer і найпершим: рішення «пускати чи ні»
     має бути ухвалене до того, як зʼявиться бодай рядок розмітки.
     Логіка — js/agegate.js, джерело правди — profile.birthDate. -->
<script src="js/agegate.js"></script>
<link rel="stylesheet" href="css/style.css">
<script>/* Позначаємо, що JS живий (анімація появи ховає блоки через CSS,
   і без цього класу сторінка без JS лишилась би порожньою) і ставимо
   ОБИДВІ осі оформлення — схему й акцент — ДО завантаження стилів:
   інакше при кожному переході блимала б типова графітова темна перед
   обраною. Тут же переносяться id прибраних кольорових тем, бо цей
   скрипт відпрацьовує раніше за app.js. */
document.documentElement.className='js';
try{var _r=document.documentElement,
_m={pink:'graphite-pink',wood:'graphite',violet:'graphite-violet',crimson:'graphite-crimson',
moss:'graphite-moss',emerald:'graphite-emerald',ocean:'graphite-ocean'},
_t=localStorage.getItem('forge.theme');
_t=_m[_t]||_t;if(_t==='graphite-amber')_t='';
if(_t&&_t.indexOf('graphite')===0)_r.setAttribute('data-theme',_t);
if(localStorage.getItem('forge.scheme')==='light'){_r.setAttribute('data-scheme','light');
var _c=document.querySelector('meta[name=theme-color]');if(_c)_c.setAttribute('content','#e7e7e7');}
}catch(e){}</script>

</head>
<body>

<!-- Перший елемент у порядку табуляції: дозволяє з клавіатури
     перескочити меню й потрапити одразу в контент. -->
<a class="skip-link" href="#main">До вмісту</a>

<div class="bg-fx"></div>

<header id="site-nav"></header>

<main id="main" tabindex="-1">

  <!-- ========== СЬОГОДНІ ==========
       Головна Forge — це і є екран дня. Раніше їх було два: index.html
       переказував стан і вів кнопкою на today.html, де стан можна було
       ЗМІНИТИ. Два екрани на одне питання «що в мене зараз» означали
       зайвий перехід у кожній щоденній дії й два місця, які могли
       розійтись у показаннях. Тепер сторінка одна, а today.html лишився
       перенаправленням для старих посилань і закладок.

       Увесь вміст малює js/today.js. Розмітка тут — каркас, щоб без JS
       сторінка чесно сказала, чому вона порожня. -->
  <section class="section section--dash">
    <div class="wrap wrap--narrow">

      <!-- Заголовок сторінки — сама дата. Слово FORGE стоїть у шапці
           за два сантиметри вище, і повторювати його тут означало б
           віддати найкраще місце екрана тому, що людина вже прочитала. -->
      <p class="dash__eyebrow">Forge</p>
      <h1 class="dash__h1" id="tdy-date">Сьогодні</h1>


      <div id="today" class="mt-2">
        <noscript><p class="small">Ця сторінка збирає ваш день із профілю — без JavaScript їй нема з чого збиратись.</p></noscript>
      </div>

    </div>
  </section>

</main>

<footer id="site-footer"></footer>

<script defer src="js/config.js"></script>
<script defer src="js/errors.js"></script>
<script defer src="js/age-core.js"></script>
<script defer src="js/onboarding-core.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/elo-core.js"></script>
<script defer src="js/elo-api.js"></script>
<script defer src="js/elo-hooks.js"></script>
<script defer src="js/history-core.js"></script>
<script defer src="js/exercises.js"></script>
<script defer src="js/reps-core.js"></script>
<script defer src="js/programs-data.js"></script>
<script defer src="js/foods.js"></script>
<script defer src="js/recipes-data.js"></script>
<script defer src="js/day-core.js"></script>
<script defer src="js/nutrition-core.js"></script>
<script defer src="js/tracker-core.js"></script>
<script defer src="js/workout-core.js"></script>
<script defer src="js/today.js"></script>
</body>
</html>
