<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 12 57 41" role="img" aria-label="FORGE">
  <!--
    FORGE — знак: ковадло.

    Тип лондонський: довгий ріг ліворуч, рівне лице, пʼятка праворуч,
    увігнута талія й розкльошена основа.

    Що робить силует «приємним», а не жорстким:

    1. Ріг конічний і зігнутий, а не трикутний. Пряма гіпотенуза дає
       відчуття вирізаного кутника; крива читається як кований конус.
    2. Талія увігнута всередину кривими Безьє. У справжнього ковадла тіло
       звужується плавно — прямий скіс перетворює його на пісочний годинник.
    3. Кути лиця й пʼятки заокруглені на 3–4 одиниці. Гострий кут у знаку
       такого розміру виглядає обрубаним, а не важким.
    4. Основа має невеликий підйом до тіла, а не стикається з ним різко.
    5. Лице звисає над талією з обох боків. Це виявилось головним: поки
       талія починалася там само, де закінчувався ріг, силует читався як
       табурет або двотавр, а не як ковадло. Звис і робить форму впізнаваною.

    Ріг цілком консольний — під ним немає опори. Через це знак несиметричний
    і візуально важчий праворуч. Так і має бути: саме цим ковадло й виглядає
    ковадлом, вирівнювати його по центру означало б зіпсувати форму.

    viewBox обрізаний по самому малюнку (4 12 57 41), без полів. Це навмисно:
    поки коробка була квадратною 64×64, малюнок займав у ній лише 64% висоти,
    і задана в CSS висота означала висоту коробки, а не ковадла — довелося б
    щоразу множити на поправку й підбирати її на око. Тепер height у CSS
    дорівнює висоті ковадла, а поля додає той, кому вони потрібні.

    Колір — нейтральний сірий #8b8b93, як у металу: помітний на темному тлі
    (контраст із фоном понад 5:1), але не сперечається з текстом і акцентом.

    Цей сірий НЕ залежить від схеми чи акценту: знак однаковий у темній і
    світлій темі й у будь-якій палітрі. Раніше CSS перефарбовував його
    фільтром у чорний і білий — це суперечило задуму, фільтр знято.
    Метал не змінює колір від того, на чому лежить.

    Увага на майбутнє: у коментарях XML не можна ставити два дефіси підряд.
    Через це запис назв CSS-змінних із префіксом ламає файл повністю —
    браузер віддає помилку розбору, а не просто ігнорує коментар.
  -->
  <path fill="#8b8b93" d="
    M4 21
    C10 15 15 12 20 12
    L57 12
    Q61 12 61 16
    L61 22
    Q61 26 57 26
    L46 26
    C44 29 43.5 32 43.5 36
    C43.5 39 46 40.5 50 41
    L52 41
    L54 53
    L14 53
    L16 41
    L18 41
    C22 40.5 24.5 39 24.5 36
    C24.5 32 24 29 22 26
    L20 26
    C15 26 8.5 24.5 4 21
    Z"/>
</svg>
